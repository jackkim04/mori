<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>모리랑 수영 한 바퀴 체험판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#8EA5F3; --bg-grad:linear-gradient(180deg,#5560EE 0%,#6A79F3 26%,#86A8F3 60%,#93D6F7 100%); --surface:rgba(255,255,255,.62); --surface-2:rgba(255,255,255,.42); --solid:#F6F7FF; --glass-edge:rgba(255,255,255,.75); --ink:#133A5E; --ink-2:#2F4B6B; --line:rgba(19,58,94,.13);
  --sea:#3E92D6; --on-sea:#FFFFFF; --sea-soft:#D9ECFA;
  --gold:#F3BE57; --gold-deep:#D99A2B; --gold-ink:#B57816; --on-gold:#133A5E;
  --ember:#F26B21; --ember-soft:#FFE6D5; --alley:#B9541A; --alley-soft:#F8E4D6;
  --fest:#7A4FC4; --fest-soft:#ECE3FA; --ok:#25855A; --seal-bg:transparent;
  --display:"Nanum Myeongjo","NanumMyeongjo","나눔명조","AppleMyungjo","Batang",serif;
  --body:"Nanum Myeongjo","NanumMyeongjo","나눔명조","AppleMyungjo","Batang",serif;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;background:var(--surface);scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;font-family:var(--body);font-size:15px;line-height:1.55;color:var(--ink);background:var(--surface);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,label{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sea);outline-offset:2px;border-radius:8px}
img,svg{max-width:100%}
h1,h2,h3,p{margin:0}
h1{font-family:var(--display);font-weight:400;font-size:26px;line-height:1.25}
h2{font-family:var(--display);font-weight:400;font-size:19px;line-height:1.3}
h3{font-size:14px;font-weight:600}

.app{height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden;background:var(--bg);max-width:560px;margin:0 auto}
@media (min-width:700px){
  html,body{background:#1B1F4E}
  body{background:linear-gradient(165deg,#191D4A 0%,#33307A 55%,#8E5791 100%) fixed}
  body{padding:20px 0}
  .app{max-width:410px;height:100%;margin:0 auto;border-radius:36px;box-shadow:0 0 0 9px #0B1030,0 30px 80px rgba(5,8,35,.6)}
  .app.wide{max-width:1060px;border-radius:22px;box-shadow:0 30px 80px rgba(5,8,35,.5)}
}

/* top bar */
.top{display:flex;align-items:center;gap:8px;padding:10px 12px 10px 16px;background:var(--surface);border-bottom:1px solid var(--line);flex:none}
.brand{background:none;border:0;padding:4px 0;font-family:var(--display);font-size:18px;color:var(--ink);text-align:left}
.brand small{font-family:var(--body);font-size:12px;color:var(--ink-2);margin-left:6px}
.demo-pill{font-size:11px;font-weight:600;color:var(--ember);background:var(--ember-soft);border-radius:999px;padding:2px 8px;margin-left:auto}
.icon-btn{width:38px;height:38px;border-radius:12px;border:0;background:transparent;display:grid;place-items:center;color:var(--ink-2)}
.icon-btn:hover{background:var(--surface-2)}
.back-btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 12px;font-size:13px;font-weight:600;margin-left:auto}

main{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.pad{padding:18px 16px 28px}

/* tab bar */
.tabs{flex:none;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding:4px 4px 6px}
.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0 2px;font-size:11px;font-weight:500;color:var(--ink-2);border-radius:12px}
.tabs button svg{width:24px;height:24px}
.tabs button[aria-current="page"]{color:var(--sea);font-weight:700}
.app.wide .tabs{display:none}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:15px;color:var(--ink);text-decoration:none}
.btn.primary{background:var(--sea);border-color:var(--sea);color:var(--on-sea)}
.btn.ember{background:var(--ember);border-color:var(--ember);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.btn.block{width:100%}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}
.row-btns .btn{flex:1}
.tiny{font-size:12px;color:var(--ink-2);line-height:1.5}
.sub{font-size:13px;color:var(--ink-2)}

/* hero */
.hero{position:relative;aspect-ratio:400/292;overflow:hidden;background:#1C2152}
.hero .scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.hero-mori{position:absolute;left:50%;bottom:1%;width:60%;transform:translateX(-50%)}
.bubble{position:absolute;left:12px;top:12px;max-width:58%;background:rgba(255,255,255,.95);color:#14305A;font-size:14px;font-weight:600;line-height:1.4;padding:9px 12px;border-radius:16px 16px 16px 4px;box-shadow:0 6px 18px rgba(10,12,50,.25)}

/* Mori stage */
.stage{position:relative;width:100%;aspect-ratio:862/700;--glow-r:4px;--glow-a:.15;--bright:.9;--sat:.85}
.stage .layer{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.stage .mori{position:absolute;left:12.761%;top:17.143%;width:74.478%;height:auto;user-select:none;-webkit-user-drag:none;
  filter:drop-shadow(0 0 var(--glow-r) rgba(255,170,60,var(--glow-a))) brightness(var(--bright)) saturate(var(--sat));transition:filter .9s ease}
.stage .ember-dot{animation:twinkle 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes twinkle{0%,100%{opacity:.55}50%{opacity:1}}
.stage .pop{animation:pop .5s cubic-bezier(.3,1.6,.5,1) both;transform-box:fill-box;transform-origin:center}
@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}

/* home */
.home-body{padding:16px 16px 26px;display:grid;gap:14px}
.meter{display:flex;gap:12px;align-items:stretch}
.meter-main{flex:1;background:var(--surface);border-radius:18px;padding:14px 14px 12px}
.flames{display:flex;gap:4px;margin:8px 0 6px}
.flames svg{width:22px;height:22px;color:var(--line)}
.flames svg.lit{color:var(--ember);filter:drop-shadow(0 0 4px rgba(242,107,33,.5))}
.disc{flex:none;width:118px;border:0;border-radius:18px;background:var(--sea);color:var(--on-sea);display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;padding:14px;text-align:left}
.disc b{font-family:var(--display);font-weight:400;font-size:34px;line-height:1}
.disc span{font-size:13px;font-weight:600}
.disc.off{background:var(--surface);color:var(--ink-2);border:1.5px dashed var(--line)}
.panel{background:var(--surface);border-radius:18px;padding:14px}
.today-list{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px}
.today-list li{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:600;font-size:14px}
.lim{flex:none;font-size:11px;font-weight:700;color:var(--fest);background:var(--fest-soft);border-radius:999px;padding:3px 8px}
.cta{display:grid;gap:8px}

/* chips & options */
.opt-group{margin-top:16px}
.opt-group h2{font-size:16px;margin-bottom:8px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px}
.opt[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.zone{font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;white-space:nowrap}
.z-beach{color:var(--sea);background:var(--sea-soft)}
.z-festival{color:var(--fest);background:var(--fest-soft)}
.z-alley{color:var(--alley);background:var(--alley-soft)}

/* course */
.course-out{margin-top:20px}
.thinking{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:18px;padding:16px}
.thinking .dots{display:flex;gap:4px}
.thinking .dots i{width:8px;height:8px;border-radius:50%;background:var(--ember);animation:bob 1s infinite ease-in-out}
.thinking .dots i:nth-child(2){animation-delay:.15s}.thinking .dots i:nth-child(3){animation-delay:.3s}
@keyframes bob{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(-4px);opacity:1}}
.cr-head{margin-bottom:12px}
.src{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;margin-bottom:6px;background:var(--surface-2);color:var(--ink-2)}
.src.ai{background:var(--ember-soft);color:var(--ember)}
.stops{list-style:none;margin:0;padding:0;position:relative}
.stop{position:relative;display:grid;grid-template-columns:34px 1fr;gap:10px;padding-bottom:12px}
.stop:not(:last-child)::before{content:"";position:absolute;left:16px;top:34px;bottom:0;width:2px;background:var(--line)}
.stop-n{width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center;font-family:var(--display);font-size:17px}
.stop-card{background:var(--surface);border-radius:16px;padding:11px 13px}
.stop-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.stop-top b{font-size:15px}
.stop-meta{font-size:12px;color:var(--ink-2);margin-top:1px}
.stop-why{font-size:14px;margin-top:5px}
.stop-flag{font-size:12px;font-weight:600;margin-top:6px;color:var(--alley)}
.stop-flag.done{color:var(--ok)}
.notice{font-size:13px;background:var(--ember-soft);color:var(--ink);border-radius:12px;padding:10px 12px;margin-bottom:12px}

/* stamps */
.head-row{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.chips{display:flex;gap:6px}
.chip{border:0;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.chip.ember{background:var(--ember-soft);color:var(--ember)}
.chip.sea{background:var(--sea);color:var(--on-sea)}
.map{margin-top:14px;background:var(--surface);border-radius:18px;padding:6px;overflow:hidden}
.map svg{display:block;width:100%;height:auto}
.hint{display:flex;gap:10px;align-items:flex-start;margin-top:12px;font-size:13px;color:var(--ink-2)}
.hint svg{flex:none;width:28px;height:28px;color:var(--sea)}
.grp{margin:22px 0 10px}
.grp p{font-size:12px;color:var(--alley);font-weight:600;margin-top:2px}
.seals{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.seal-cell{background:var(--surface);border-radius:16px;padding:10px 6px 10px;text-align:center}
.seal-cell svg.seal{width:78%;display:block;margin:0 auto}
.seal-empty{width:78%;aspect-ratio:1;margin:0 auto;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;font-family:var(--display);font-size:13px;white-space:nowrap;letter-spacing:-.02em;color:var(--ink-2);padding:2px}
.seal .paper{fill:var(--seal-bg)}
.ov .seal .paper{fill:#FFF6E8}
.seal-name{font-size:12px;font-weight:600;margin-top:6px;line-height:1.35}
.seal-time{font-size:11px;color:var(--ink-2)}
.fake{display:inline-block;font-size:10px;font-weight:600;color:var(--ink-2);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:2px;vertical-align:1px}

/* coupon */
.ladder{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:14px;align-items:end}
.rung{border-radius:12px;background:var(--surface);padding:8px 8px 10px;text-align:center;border:2px solid transparent}
.rung b{display:block;font-family:var(--display);font-weight:400;font-size:24px;line-height:1.1}
.rung span{font-size:12px;color:var(--ink-2)}
.rung:nth-child(1){min-height:64px}.rung:nth-child(2){min-height:78px}.rung:nth-child(3){min-height:92px}
.rung.on{border-color:var(--sea);background:var(--sea-soft)}
.rung.on b{color:var(--sea)}
.ladder-note{font-size:13px;margin-top:10px}
.ladder-note strong{color:var(--alley)}
.coupon{margin-top:16px;background:#FFFFFF;color:#14305A;border-radius:20px;padding:16px 16px 14px;box-shadow:0 1px 0 rgba(20,48,90,.06);position:relative;overflow:hidden;border:1.5px solid var(--line)}
.coupon::before,.coupon::after{content:"";position:absolute;top:62px;width:18px;height:18px;border-radius:50%;background:var(--bg)}
.coupon::before{left:-9px}.coupon::after{right:-9px}
.coupon-top{display:flex;align-items:baseline;gap:10px;border-bottom:2px dashed #D3E0EA;padding-bottom:12px;margin-bottom:12px}
.coupon-top b{font-family:var(--display);font-weight:400;font-size:40px;line-height:1;color:#1C6DB5}
.coupon-top span{font-size:14px;font-weight:600}
.barcode{display:block;width:100%;height:92px}
.coupon-help{font-size:12px;color:#4F6482;margin-top:6px;text-align:center}
.calc{margin-top:14px;background:var(--surface);border-radius:18px;padding:14px}
.calc label{font-size:13px;font-weight:600;color:var(--ink-2)}
.amt-row{display:flex;align-items:center;gap:8px;margin-top:4px}
.amt-row input{flex:1;min-width:0;font-size:24px;font-weight:600;border:0;border-bottom:2px solid var(--line);background:transparent;padding:4px 2px;font-variant-numeric:tabular-nums}
.amt-row input:focus{outline:none;border-bottom-color:var(--sea)}
.quick{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.calc dl{margin:14px 0 12px;display:grid;gap:6px}
.calc dl div{display:flex;justify-content:space-between;font-size:14px}
.calc dt{color:var(--ink-2)}
.calc dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums}
.calc dl .total{border-top:1px solid var(--line);padding-top:8px;margin-top:2px}
.calc dl .total dt{color:var(--ink);font-weight:700}
.calc dl .total dd{font-size:20px;color:var(--sea)}
.limit{margin-top:14px}
.limit-bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin:6px 0}
.limit-bar i{display:block;height:100%;background:var(--ember);border-radius:99px;transition:width .5s}
.uses{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.uses li{display:flex;justify-content:space-between;font-size:13px;background:var(--surface);border-radius:10px;padding:8px 12px}

/* mori screen */
.mori-top{background:linear-gradient(180deg,#232659 0%,#3A3480 60%,#5B3F86 100%);padding:10px 16px 18px;color:#F4F1FF}
.mori-top .stage{max-width:300px;margin:0 auto}
.story{font-size:13px;text-align:center;opacity:.9;margin-top:4px}
.mori-top .flames{justify-content:center}
.mori-top .flames svg{color:rgba(255,255,255,.22)}
.mori-top .flames svg.lit{color:#FFB347}
.seg-tabs{display:flex;gap:4px;margin:16px 16px 0;background:var(--surface-2);border-radius:12px;padding:4px}
.seg-tabs button{flex:1;border:0;background:none;border-radius:9px;padding:8px;font-weight:700;font-size:14px;color:var(--ink-2)}
.seg-tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.items{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.item{border:2px solid transparent;background:var(--surface);border-radius:14px;padding:6px 4px 8px;text-align:center;position:relative}
.item svg{display:block;width:100%;aspect-ratio:1;height:auto}
.item p{font-size:11px;font-weight:600;line-height:1.3;margin-top:2px}
.item.on{border-color:var(--sea)}
.item.on::after{content:"착용";position:absolute;top:4px;right:4px;font-size:10px;font-weight:700;background:var(--sea);color:var(--on-sea);border-radius:6px;padding:0 5px}
.item.locked svg{filter:grayscale(1) opacity(.32)}
.item.locked p{color:var(--ink-2)}
.item .where{font-size:10px;color:var(--ink-2);font-weight:500}
.item .lim{position:absolute;top:4px;left:4px;font-size:9px;padding:1px 5px}
.dex-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.goods{margin-top:14px;font-size:13px;background:var(--surface);border-radius:14px;padding:12px;display:flex;gap:10px;align-items:center}
.goods b{font-family:var(--display);font-weight:400;font-size:22px;color:var(--ember);flex:none}

/* card */
.card-prev{margin-top:14px;border-radius:18px;overflow:hidden;background:var(--surface-2);aspect-ratio:1080/1350;display:grid;place-items:center}
.card-prev img{width:100%;height:100%;object-fit:cover;display:block}
.consent{display:flex;gap:10px;align-items:flex-start;margin-top:16px;background:var(--surface);border-radius:14px;padding:12px;font-weight:600;font-size:14px}
.consent input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--sea);flex:none}
.empty{background:var(--surface);border-radius:18px;padding:22px 16px;text-align:center;margin-top:14px;display:grid;gap:12px;justify-items:center}
.empty p{color:var(--ink-2);font-size:14px}

/* overlay */
#overlay{position:absolute;inset:0;z-index:30;display:none}
#overlay.open{display:block}
.ov{position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 30%,#3A3480 0%,#1C1F4D 70%);color:#F5F2FF;overflow-y:auto;display:flex;flex-direction:column;align-items:center;padding:22px 20px 20px;text-align:center}
.ov-kind{font-size:12px;font-weight:700;opacity:.75}
.ov-place{font-family:var(--display);font-size:26px;font-weight:400;margin-top:2px}
.ov-steps{list-style:none;padding:0;margin:12px 0 0;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.ov-steps li{font-size:12px;font-weight:600;border-radius:999px;padding:5px 10px 5px 8px;background:rgba(255,255,255,.08);color:rgba(255,255,255,.5);display:flex;gap:6px;align-items:center;transition:all .3s}
.ov-steps li i{width:14px;height:14px;border-radius:50%;border:2px solid currentColor;display:grid;place-items:center;font-style:normal;font-size:9px}
.ov.s1 .ov-steps li:nth-child(1),.ov.s2 .ov-steps li:nth-child(2){background:rgba(122,230,170,.16);color:#9CF0C3}
.ov.s1 .ov-steps li:nth-child(1) i::after,.ov.s2 .ov-steps li:nth-child(2) i::after{content:"✓"}
.ov-stage{position:relative;width:min(270px,72vw);margin-top:10px}
.ov-seal{position:absolute;left:50%;top:44%;width:52%;transform:translate(-50%,-50%) scale(1.8);opacity:0;z-index:3;pointer-events:none}
.ov-seal svg{width:100%;display:block;filter:drop-shadow(0 0 0 rgba(0,0,0,0))}
.ov-seal .ink{fill:rgba(255,255,255,.9)}
.ov.s3 .ov-seal{animation:slam .55s cubic-bezier(.2,.9,.3,1.25) forwards}
.ov.s4 .ov-seal{animation:settle .7s cubic-bezier(.5,0,.2,1) forwards}
@keyframes settle{from{opacity:1;transform:translate(-50%,-50%) scale(1)}to{opacity:1;transform:translate(-112%,-92%) scale(.55)}}
@keyframes slam{0%{opacity:0;transform:translate(-50%,-50%) scale(1.9) rotate(-8deg)}60%{opacity:1;transform:translate(-50%,-50%) scale(.92) rotate(2deg)}100%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0)}}
.ov-moriwrap{opacity:.35;transition:opacity .6s}
.ov.s3 .ov-moriwrap{opacity:.55}
.ov.s4 .ov-moriwrap{opacity:1}
.ov-spark{position:absolute;left:50%;top:48%;width:16px;height:16px;margin:-8px;border-radius:50%;background:#FFC060;box-shadow:0 0 16px 8px rgba(255,170,60,.7);opacity:0;z-index:4}
.ov.s4 .ov-spark{animation:spark .9s ease-out forwards}
@keyframes spark{0%{opacity:0;transform:translate(-80px,-90px) scale(.6)}30%{opacity:1}100%{opacity:0;transform:translate(0,0) scale(2.2)}}
.ov-rewards{width:100%;max-width:340px;margin-top:8px;opacity:0;transform:translateY(8px);transition:all .45s}
.ov.s5 .ov-rewards{opacity:1;transform:none}
.ov-fr{font-family:var(--display);font-size:18px;color:#FFC36B}
.ov-items{display:flex;gap:8px;justify-content:center;margin:10px 0}
.ov-item{background:rgba(255,255,255,.1);border-radius:14px;padding:6px 8px 8px;width:96px}
.ov-item svg{width:100%;aspect-ratio:1;display:block}
.ov-item p{font-size:12px;font-weight:700}
.ov-item .lim{display:inline-block;margin-top:3px;background:rgba(179,149,238,.25);color:#D9C8FF}

/* sheet */
#sheet{position:absolute;inset:0;z-index:40;display:none}
#sheet.open{display:block}
.sheet-bg{position:absolute;inset:0;background:rgba(5,10,30,.45);border:0;width:100%}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:86%;overflow-y:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:18px 16px 22px;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.sheet h3{margin:16px 0 8px}
.tool-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tool-grid button{border:1.5px solid var(--line);background:var(--surface-2);border-radius:10px;padding:8px 2px;font-size:12px;font-weight:600}
.tool-grid button.done{opacity:.45}
.tag-list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;font-size:12px}
.tag-list li{display:flex;justify-content:space-between;gap:6px;border-bottom:1px solid var(--line);padding:4px 0}
.tag-list code{font-family:var(--body);font-weight:600;color:var(--sea)}
.tool-row{display:grid;gap:8px;margin-top:16px}
.btn.danger{color:#C2353B;border-color:#F0C9CB}

/* toast */
#toast{position:absolute;left:50%;bottom:84px;transform:translateX(-50%) translateY(10px);z-index:50;background:#14305A;color:#fff;font-size:14px;font-weight:600;padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:all .25s;max-width:88%;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}

/* admin */
.admin{padding:18px 16px 32px;max-width:1000px;margin:0 auto}
.admin-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px}
.period{font-size:13px;font-weight:600;color:var(--ink-2);background:var(--surface);border-radius:10px;padding:6px 10px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:16px}
@media (min-width:760px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--surface);border-radius:16px;padding:14px}
.kpi p{font-size:13px;color:var(--ink-2);font-weight:600}
.kpi b{display:block;font-family:var(--display);font-weight:400;font-size:28px;line-height:1.15;margin-top:4px}
.kpi .bar{height:6px;border-radius:9px;background:var(--surface-2);margin:8px 0 4px;overflow:hidden}
.kpi .bar i{display:block;height:100%;background:var(--sea);border-radius:9px}
.kpi small{font-size:12px;color:var(--ink-2)}
.a-grid{display:grid;gap:12px;margin-top:12px}
@media (min-width:760px){.a-grid{grid-template-columns:1fr 1fr}}
.a-card{background:var(--surface);border-radius:16px;padding:16px}
.a-card h2{font-size:17px;margin-bottom:12px}
.hbars{display:grid;gap:8px}
.hbar{display:grid;grid-template-columns:132px 1fr 50px;align-items:center;gap:8px;font-size:13px}
.hbar .track{height:14px;background:var(--surface-2);border-radius:6px;overflow:hidden}
.hbar .track i{display:block;height:100%;border-radius:6px}
.hbar .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.live{font-size:10px;font-weight:700;color:var(--ember);margin-left:4px}
.flow{margin-bottom:14px}
.flow p{font-size:13px;font-weight:600;margin-bottom:6px}
.stack{display:flex;height:22px;border-radius:7px;overflow:hidden}
.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:6px;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend span::before{content:"";width:9px;height:9px;border-radius:3px;background:var(--c)}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-weight:600;color:var(--ink-2);padding:6px 4px;border-bottom:1px solid var(--line)}
table.t td{padding:8px 4px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
table.t td.n,table.t th.n{text-align:right}
table.t tr.live-row td{color:var(--ember);font-weight:600}
.settle{display:grid;gap:8px;font-size:14px}
.settle div{display:flex;justify-content:space-between}
.settle .sum{border-top:1px solid var(--line);padding-top:8px;font-weight:700}
.settle .sum span:last-child{color:var(--sea);font-size:18px}
.a-note{font-size:12px;color:var(--ink-2);margin-top:14px}

.qr-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px}
@media (min-width:760px){.qr-grid{grid-template-columns:repeat(4,1fr)}}
.qr-cell{background:#FFFFFF;color:#14305A;border:1.5px dashed #B8C7D6;border-radius:12px;padding:14px;text-align:center;display:grid;gap:4px;justify-items:center;break-inside:avoid}
.qr-code{width:100%;max-width:200px}
.qr-code svg{display:block;width:100%;height:auto}
.qr-cell b{font-size:14px}
.qr-cell span{font-size:12px;color:#1C6DB5;font-weight:600}
.qr-help{text-align:left;justify-items:start;align-content:start}
.qr-help ol{margin:4px 0 0;padding-left:18px;font-size:12px;line-height:1.6}
@media print{
  @page{size:A4;margin:12mm}
  html,body{background:#FFFFFF !important;height:auto;padding:0}
  .app{max-width:none !important;height:auto !important;margin:0 !important;box-shadow:none !important;border-radius:0 !important;overflow:visible !important;background:#FFFFFF}
  .top,.tabs,#toast,.no-print{display:none !important}

}
.course-sec{margin-top:20px}

.season{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;margin-right:4px;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.now{display:inline-block;font-size:10px;font-weight:700;color:#fff;background:var(--ember);border-radius:6px;padding:1px 6px}
.cmap{position:relative;border-radius:16px;overflow:hidden;background:var(--surface-2);margin-top:14px}
.cmap img{display:block;width:100%;height:100%;object-fit:cover}
.pin{position:absolute;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;background:#fff;color:var(--c);border:3px solid var(--c);font-weight:700;font-size:12px;display:grid;place-items:center;z-index:3;box-shadow:0 1px 3px rgba(0,0,0,.3)}

.cprog{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-top:12px;color:var(--c)}

.prog-bar{height:8px;border-radius:9px;background:var(--surface);overflow:hidden;margin-top:6px}

.info{font-size:13px;background:var(--surface);border-radius:12px;padding:10px 12px;margin-top:10px}
.slist{list-style:none;margin:16px 0 0;padding:0}
.srow{display:grid;grid-template-columns:30px 1fr;gap:10px;background:var(--surface);border-radius:14px;padding:11px 12px}
.srow .sn{width:30px;height:30px;border-radius:50%;border:3px solid var(--c);color:var(--c);display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--surface)}

.srow b{font-size:15px}
.srow .k{font-size:11px;font-weight:600;color:var(--ink-2);margin-left:6px}
.srow p{font-size:13px;color:var(--ink-2);margin-top:2px}
.srow .arrive{color:var(--c);font-weight:600}
.srow .when{font-size:12px;font-weight:700;color:var(--ok);margin-top:4px}
.seg{display:flex;align-items:center;padding:4px 0 4px 26px;font-size:13px;font-weight:700;color:var(--ink)}
.seg::before{content:"";flex:none;width:3px;height:26px;margin-right:12px;background:repeating-linear-gradient(var(--c) 0 4px,transparent 4px 8px)}
.reward{display:flex;gap:12px;align-items:center;background:var(--surface);border-radius:16px;padding:12px;margin-top:14px}
.reward svg{width:60px;height:60px;flex:none}
.reward b{font-size:15px}
.ov-next{margin-top:10px;background:rgba(255,255,255,.1);border-radius:14px;padding:10px 12px;display:grid;gap:2px;text-align:center}
.ov-next span{font-size:12px;opacity:.75}
.ov-next b{font-size:16px}
.ov-next em{font-style:normal;font-family:var(--display);font-size:20px;color:#FFC36B}
.ov-done{font-family:var(--display);font-size:26px;color:#FFC36B}
.ov-sub{font-size:14px;margin-top:2px}
.ov-item.big{width:120px}
.tool-courses{display:flex;flex-wrap:wrap;gap:6px}
.tool-courses button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 10px;font-size:12px;font-weight:600}
.tool-courses button[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff}
.tool-grid{grid-template-columns:repeat(2,1fr) !important}
.qr-course{margin:22px 0 0;font-size:18px}
.qr-help-row{font-size:12px;background:var(--surface);border-radius:12px;padding:10px 12px;margin-top:10px}
@media print{.qr-course{break-after:avoid}}
.wait.below{transform:translate(-50%,4%)}
.wait.below .wait-b{top:auto;bottom:-2%;transform:translate(-50%,100%)}

.app.has-fab main{padding-bottom:84px}
#fab{position:absolute;right:14px;bottom:76px;z-index:20}
.fab{display:flex;align-items:center;gap:8px;border:0;border-radius:999px;background:var(--c);color:#fff;padding:10px 18px 10px 12px;font-weight:700;font-size:15px;box-shadow:0 8px 20px rgba(10,20,60,.3)}
.fab svg{width:30px;height:30px}
#nfc{position:absolute;inset:0;z-index:35;display:none;background:rgba(8,12,40,.55);align-items:center;justify-content:center}
#nfc.open{display:flex}
.nfc-card{background:var(--surface);border-radius:22px;padding:24px 28px;display:grid;justify-items:center;gap:6px;min-width:220px;text-align:center}
.nfc-card b{font-size:16px}
.nfc-card span{font-size:13px;color:var(--ink-2)}
.nfc-ico{width:76px;height:76px;color:var(--sea)}
.nfc-ico svg{width:100%;height:100%}
.nfc-ico .w1{animation:wave 1s ease-in-out infinite}
.nfc-ico .w2{animation:wave 1s ease-in-out .25s infinite}
@keyframes wave{0%,100%{opacity:.2}50%{opacity:1}}
.coach{position:absolute;left:0;right:0;bottom:70px;padding:0 10px;z-index:45;pointer-events:none}
.coach[hidden]{display:none}
.coach .cc{pointer-events:auto;background:var(--surface);border-radius:20px;padding:12px 16px 14px;box-shadow:0 10px 30px rgba(5,10,40,.35),0 0 0 1px var(--line);display:grid;gap:6px}
.coach .cc-top{display:flex;justify-content:space-between;align-items:center}
.coach .step{font-size:13px;font-weight:700;color:var(--sea)}
.coach .skip{border:0;background:none;color:var(--ink-2);font-size:13px;font-weight:600;padding:6px 2px}
.coach h2{font-size:18px}
.coach p{font-size:14px;color:var(--ink-2);line-height:1.5}
.app.touring main{padding-bottom:250px}
.app.touring .ov{padding-bottom:260px}
.app.touring .ov-actions{display:none}
.nc-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.nc-chips button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.nc-chips button[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff}
.nc-prev{position:relative;margin-top:14px;border-radius:18px;overflow:hidden;background:#161D47;aspect-ratio:1080/1920;display:grid;place-items:center}
.nc-prev img{position:absolute;inset:0;width:100%;height:100%;display:block}
.nc-hit{position:absolute;border:0;background:transparent;border-radius:12px;display:flex;align-items:flex-start;justify-content:flex-start;padding:6px}

.share-qr svg{display:block;width:100%;height:auto}
.share-url{word-break:break-all;max-width:520px}

.app.has-fab #toast{bottom:140px}

.mys{display:grid;place-items:center;width:100%;aspect-ratio:1;border-radius:12px;background:linear-gradient(145deg,#FFC36B,#F26B21);color:#fff;font-family:var(--display);font-size:24px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
.ccard .rew .mys{width:44px;height:44px;font-size:24px}
.mys.big{width:60px;height:60px;flex:none;font-size:32px;border-radius:14px}
.mys.dex{width:72%;margin:6px auto 4px;font-size:30px;border-radius:14px}
.item.locked .mys{filter:none}
.ov.batch{justify-content:flex-start}
.bphase{width:100%;display:flex;flex-direction:column;align-items:center;text-align:center}
.bseals{display:flex;flex-wrap:wrap;justify-content:center;gap:12px 10px;margin:18px 0 12px;max-width:340px}
.bs{width:96px;display:grid;justify-items:center;gap:4px;opacity:0;transform:scale(1.8) rotate(-8deg)}
.bs svg.seal{width:84px;height:84px}
.bs span{font-size:11px;font-weight:600;opacity:.85;line-height:1.3}
.ov.go .bs{animation:slam2 .45s cubic-bezier(.2,.9,.3,1.25) var(--d) forwards}
@keyframes slam2{0%{opacity:0;transform:scale(1.8) rotate(-8deg)}60%{opacity:1;transform:scale(.92)}100%{opacity:1;transform:none}}
.b2{display:none}
.ov.reveal .b1{display:none}
.ov.reveal .b2{display:flex;animation:fadein .35s ease-out}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.rv-pre{font-family:var(--display);font-size:24px;color:#FFFFFF;margin-top:6px}
.rv-stage{position:relative;width:min(300px,76vw);aspect-ratio:1;display:grid;place-items:center;margin-top:6px;perspective:900px}
.rays{position:absolute;inset:-14%;border-radius:50%;background:repeating-conic-gradient(rgba(255,200,110,.38) 0deg 9deg,transparent 9deg 18deg);-webkit-mask:radial-gradient(circle,#000 22%,transparent 68%);mask:radial-gradient(circle,#000 22%,transparent 68%);opacity:0;transition:opacity .5s}
.ov.open .rays{opacity:1;animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rv-card{position:relative;width:64%;aspect-ratio:1;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,1.5,.5,1);animation:wiggle .6s ease-in-out 2}
.ov.open .rv-card{transform:rotateY(180deg) scale(1.18);animation:none}
.rv-front,.rv-back{position:absolute;inset:0;border-radius:30px;-webkit-backface-visibility:hidden;backface-visibility:hidden;display:grid;place-items:center}
.rv-front{background:linear-gradient(145deg,#FFC36B,#F26B21);color:#fff;font-family:var(--display);font-size:110px;box-shadow:0 12px 30px rgba(0,0,0,.35)}
.rv-back{background:#FFF8EE;transform:rotateY(180deg);box-shadow:0 0 0 6px rgba(255,195,107,.7),0 0 70px 14px rgba(255,180,80,.55)}
.rv-back svg{width:86%;height:86%}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-9deg) scale(1.04)}75%{transform:rotate(9deg) scale(1.04)}}
.confetti{position:absolute;inset:0;pointer-events:none}
.confetti i{position:absolute;left:50%;top:50%;width:10px;height:15px;border-radius:2px;opacity:0;transform:translate(-50%,-50%)}
.ov.open .confetti i{animation:conf 1.2s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes conf{0%{opacity:1;transform:translate(-50%,-50%) rotate(0)}80%{opacity:1}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(var(--r))}}
.rv-title{font-family:var(--display);font-size:34px;color:#FFC36B;margin-top:14px}
.rv-sub{font-size:14px;opacity:.88;margin-top:2px}

@media (prefers-reduced-motion: reduce){.bs{opacity:1 !important;transform:none !important}}

  *{animation:none !important;transition:none !important}

}

.ov-seal .ink{fill:rgba(19,58,94,.85)}
.rays{background:repeating-conic-gradient(rgba(243,190,87,.5) 0deg 9deg,transparent 9deg 18deg)}
.rv-back{box-shadow:0 0 0 6px rgba(243,190,87,.75),0 0 70px 14px rgba(243,190,87,.5)}
.sheet-bg{background:rgba(19,58,94,.32)}
#nfc{background:rgba(19,58,94,.32)}
#toast{background:var(--ink)}
.nc-prev{background:var(--surface-2);border-radius:24px;border:1px solid var(--line);box-shadow:0 6px 24px rgba(30,90,150,.12)}
.insta{margin-top:14px;min-height:56px;font-size:17px;border-radius:18px}
.insta svg{width:20px;height:20px}
.cap-note{text-align:center;margin-top:8px}
@media (min-width:700px){
  html,body{background:#CFE7F8}
  body{background:linear-gradient(165deg,#E3F2FD 0%,#C4E3F8 55%,#A8D2F1 100%) fixed}
  .app{box-shadow:0 0 0 9px #FFFFFF,0 30px 80px rgba(30,90,150,.25)}
  .app.wide{box-shadow:0 30px 80px rgba(30,90,150,.25)}
}

/* 바탕: 진한 연보라빛 파랑 → 하늘색, 그 위 레이어는 반투명 유리 느낌 */
html,body{background:#5560EE}
.app{background:var(--bg-grad)}
.mori-top{background:transparent}
.top{background:rgba(255,255,255,.38);border-bottom:1px solid rgba(255,255,255,.45)}
.tabs{background:rgba(255,255,255,.5);border-top:1px solid rgba(255,255,255,.6)}
.tabs button{color:#2F4B6B}
.demo-pill{background:rgba(255,243,218,.92)}
.icon-btn{color:var(--ink)}
.icon-btn:hover{background:rgba(255,255,255,.4)}
.back-btn{background:rgba(255,255,255,.6);border-color:var(--glass-edge)}
.panel,.meter-main,.stop-card,.ccard,.srow,.calc,.reward,.info,.consent,.empty,.seal-cell,.item,.goods,.kpi,.a-card,.uses li,.rung,.thinking,.qr-help-row,.map,.cmap,.nc-prev{border:1px solid var(--glass-edge);box-shadow:0 6px 22px rgba(56,72,190,.14)}
.btn{background:rgba(255,255,255,.6);border-color:var(--glass-edge);color:var(--ink)}
.btn.primary{background:linear-gradient(180deg,#F7CB6B,#F0B445);border-color:#F7CB6B;color:var(--on-gold);box-shadow:0 6px 18px rgba(217,154,43,.38)}
.btn.danger{background:rgba(255,255,255,.7)}
.opt,.nc-chips button,.tool-courses button{background:rgba(255,255,255,.6);border-color:var(--glass-edge)}
.ccard .shape{background:rgba(255,255,255,.75)}
.seg-tabs{background:rgba(255,255,255,.32)}
.seg-tabs button[aria-selected="true"]{background:rgba(255,255,255,.92)}
.srow .sn{background:#FFFFFF}
.prog-bar,.limit-bar,.kpi .bar,.hbar .track{background:rgba(255,255,255,.55)}
.rung.on{background:rgba(255,255,255,.9);border-color:var(--sea)}
.disc{background:linear-gradient(150deg,#4B5BE6,#3E92D6);box-shadow:0 6px 20px rgba(56,72,190,.3)}
.disc.off{background:rgba(255,255,255,.4);border-color:rgba(255,255,255,.8)}
.coupon{border-color:var(--glass-edge);box-shadow:0 8px 26px rgba(56,72,190,.18)}
.coupon::before,.coupon::after{display:none}
.coupon{-webkit-mask:radial-gradient(circle at 0 71px,transparent 9px,#000 9.5px) left/51% 100% no-repeat,radial-gradient(circle at 100% 71px,transparent 9px,#000 9.5px) right/51% 100% no-repeat;mask:radial-gradient(circle at 0 71px,transparent 9px,#000 9.5px) left/51% 100% no-repeat,radial-gradient(circle at 100% 71px,transparent 9px,#000 9.5px) right/51% 100% no-repeat}
.amt-row input{border-bottom-color:rgba(19,58,94,.25)}
.coach .cc{background:rgba(247,248,255,.9);-webkit-backdrop-filter:blur(18px) saturate(1.3);backdrop-filter:blur(18px) saturate(1.3);border:1px solid var(--glass-edge)}
.sheet{background:rgba(244,246,255,.96);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.tool-grid button{background:rgba(255,255,255,.75)}
.nfc-card{background:rgba(247,248,255,.95)}
.wait-b,.bubble{background:rgba(255,255,255,.95)}
/* text that sits straight on the gradient */
.pad > .sub,.pad > p.sub,.pad > .tiny,.course-sec > p,.course-sec > .sub,.grp p,.story,.cap-note,.hint,.ladder-note,.head-row .sub,.cr-head .sub,.dex-head .sub,.admin-head .sub,.share-page .sub,.cprog span:last-child,.mori-top + .seg-tabs ~ section .tiny{color:var(--ink)}
.grp p{color:#7A2E06}
/* stamp and reveal screens on the same gradient */
.ov{background:radial-gradient(90% 55% at 50% 32%,rgba(255,255,255,.55) 0%,rgba(255,255,255,0) 70%),var(--bg-grad);color:var(--ink)}
.ov-steps li{background:rgba(255,255,255,.4);color:rgba(19,58,94,.6)}
.ov-item,.ov-disc,.ov-next{background:rgba(255,255,255,.6);border:1px solid var(--glass-edge)}
.ov-actions .btn.ghost{background:rgba(255,255,255,.6);border:1px solid var(--glass-edge);color:var(--ink)}
.ov-actions .btn.primary{background:linear-gradient(180deg,#F7CB6B,#F0B445);color:var(--on-gold)}
.rv-title,.ov-done{color:#FFFFFF;text-shadow:0 2px 0 rgba(19,58,94,.35),0 0 22px rgba(243,190,87,.9)}
.ov-fr,.ov-next em,.ov-disc strong{color:#8A5A0E}
@media (min-width:700px){
  html,body{background:#7F92F4}
  body{background:linear-gradient(165deg,#5E6CE8 0%,#7F92F4 50%,#A4D0EF 100%) fixed}
  .app{box-shadow:0 0 0 9px rgba(255,255,255,.85),0 30px 80px rgba(40,50,150,.35)}
}

/* 더 진한 바탕에 맞춘 글씨: 위쪽 진한 부분의 제목은 흰 글씨, 그 아래는 남색 */
.pad > h1,.pad > h1 + .sub,.pad > h1 + p,.pad > h1 + .sub + p,.pad > .season + h1,.pad > .season + h1 + .sub,.pad > .season + h1 + .sub + p,.story,.ov-kind,.ov-place,.rv-pre{color:#FFFFFF;text-shadow:0 1px 2px rgba(20,24,110,.45)}
.pad > .sub,.course-sec > p,.course-sec > h2,.grp p,.cap-note,.hint,.ladder-note,.seg,.cprog span:last-child,.home-body > h2,.opt-group h2,.dex-head,.mori-top ~ section .tiny{text-shadow:0 0 6px rgba(255,255,255,.55)}
/* 체험 안내 박스 */
.coach .cc{background:linear-gradient(150deg,#3C45C6 0%,#4A62D6 55%,#4D7ADB 100%);color:#FFFFFF;border:1px solid rgba(255,255,255,.35);box-shadow:0 14px 34px rgba(28,30,120,.45),inset 0 1px 0 rgba(255,255,255,.25)}
.coach h2{color:#FFFFFF}
.coach p{color:rgba(255,255,255,.9)}
.coach .step{color:#FFD27A}
.coach .skip{color:rgba(255,255,255,.82)}
.coach .btn:not(.primary){background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.45);color:#FFFFFF}
.coach .btn.primary{box-shadow:0 6px 18px rgba(10,12,80,.35)}

/* 표정 모리 */
.stage .mori.expr{left:50%;top:14%;height:80%;width:auto;transform:translateX(-50%)}
.emo{display:block;height:116px;width:auto;margin:0 auto 2px;filter:drop-shadow(0 6px 10px rgba(40,50,150,.2))}
.nc-prev .emo{position:static;inset:auto;height:116px;width:auto;margin:0 auto 2px}
.coach .cc{position:relative}
.cc-mori{position:absolute;right:92px;top:-64px;height:72px;width:auto;pointer-events:none;filter:drop-shadow(0 4px 6px rgba(20,30,110,.28));animation:hop .5s cubic-bezier(.3,1.6,.5,1) both}
@keyframes hop{from{transform:translateY(14px) scale(.85);opacity:0}to{transform:none;opacity:1}}
/* 체험 안내 박스: 밝은 색 */
.coach .cc{background:var(--coach-bg);color:var(--ink);border:1.5px solid rgba(255,255,255,.9);box-shadow:0 14px 34px rgba(40,50,150,.3),inset 0 1px 0 rgba(255,255,255,.8)}
.coach h2{color:var(--ink)}
.coach p{color:#2F4B6B}
.coach .step{color:var(--coach-accent)}
.coach .skip{color:#4A6382}
.coach .btn:not(.primary){background:rgba(255,255,255,.7);border-color:rgba(255,255,255,.9);color:var(--ink)}
.coach{--coach-bg:linear-gradient(150deg,#FFF6EC 0%,#FFE3D3 100%);--coach-accent:#D2572A}

function starPts(cx, cy, r, ir = r * 0.45, n = 5) {

  return p.join(' ');
}

function tierInfo(stamps = S.stamps) {
  const places = new Set(stamps.map(s => STAMP[s.key].place));
  const n = places.size, base = Math.min(n, 3);
  const alley = stamps.some(s => STAMP[s.key].zone === 'alley');
  const tier = Math.min(3, base + (alley && n ? 1 : 0));
  return { n, base, alley, tier, rate: TIERS[tier], bonus: alley && base < 3 };
}

  const raw = Math.floor(amount * rate / 100 / 10) * 10;

}

function nextInfo(c, fromIdx) {
  for (let j = fromIdx + 1; j < c.stamps.length; j++) {
    if (!has(c.stamps[j].key)) {
      let km = 0, min = 0; for (let k = fromIdx; k < j; k++) { km += c.segs[k][0]; min += c.segs[k][1]; }
      return { stamp: c.stamps[j], km, min, ahead: true };
    }
  }
  const back = c.stamps.find(s => !has(s.key));
  return back ? { stamp: back, ahead: false } : null;
}
function acquire(key, via) {
  const st = STAMP[key], c = COURSE[st.course];
  const prevEquipped = { ...S.equipped }, gPrev = glowLevel(), before = tierInfo();
  const prior = stampOf(key);
  if (prior) return { already: true, stamp: prior, st, c, prevEquipped, gPrev, gNow: gPrev, before, after: before };
  S.stamps.push({ key, t: Date.now(), rot: Math.round(Math.random()*24 - 12), via });
  let completed = false, item = null, fresh = false;
  if (!isDone(c) && c.stamps.every(s => has(s.key))) {
    completed = true; item = courseItem(c); S.done[c.id] = { t: Date.now(), season: c.seasons.includes(NOW_SEASON) ? NOW_SEASON : c.seasons[0] };
    if (!S.items.includes(item)) { S.items.push(item); fresh = true; }
    S.equipped[ITEMS[item].slot] = item;

  if (!S.stamps.length) return '코스 끝에서 기다릴게! 어느 길로 올래?';
  if (done) return `코스 ${done}개 완주! 다음 코스 끝에서도 기다릴게.`;
  if (!t.alley) return '망미·수영동 골목 스탬프를 찍으면 할인이 한 단계 올라가!';
  return `불씨 조각 ${S.stamps.length}개! 조금 더 밝아졌어.`;
}
function courseCard(c) {
  const n = courseCount(c), N = c.stamps.length, item = courseItem(c);
  return `<button class="ccard" data-go="c-${c.id}" style="--c:${c.color}">
    <span class="shape">${shapeSVG(c)}</span>
    <span><span class="ctop">${seasonChips(c)}</span><b>${esc(c.name)} 코스</b><span class="meta">${c.km.toFixed(1)}km, 약 ${c.min}분, ${esc(c.area)}</span>
      <span class="prog">${isDone(c) ? '완주했어요' : n ? `스탬프 ${n}/${N}` : `스탬프 ${N}곳`}</span></span>
    <span class="rew">${knownItem(item) ? thumbSVG(item) : mysteryBox()}</span>
  </button>`;
}

function qrSVG(text) {
  const q = qrcode(0, 'M'); q.addData(text); q.make();
  const n = q.getModuleCount(); let d = '';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += `M${c + 2} ${r + 2}h1v1h-1z`;
  return `<svg viewBox="0 0 ${n + 4} ${n + 4}" shape-rendering="crispEdges" role="img" aria-label="QR 코드"><rect width="${n + 4}" height="${n + 4}" fill="#FFFFFF"/><path d="${d}" fill="#14305A"/></svg>`;
}

});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if ($('#nfc').classList.contains('open')) return;
  if ($('#sheet').classList.contains('open')) closeTools();
  else if ($('#overlay').classList.contains('open')) closeOverlay('c-' + CUR);
});

/* ---------------- 1분 체험 안내 (participant) ---------------- */
let tour = null;
function closeOvSilently() { ovTimers.forEach(clearTimeout); ovTimers = []; const ov = $('#overlay'); ov.classList.remove('open'); ov.innerHTML = ''; }
function tourFinish() {
  closeOvSilently();
  const c = COURSE.bungeo; const last = c.stamps[c.stamps.length - 1];
  c.stamps.slice(0, -1).forEach(s => { if (!has(s.key)) acquire(s.key, 'trial'); });
  if (current !== 'course' || CUR !== c.id) show('course', c.id); else show('course', c.id);
  startAcquire(last.key, 'trial');
}
const TOUR = [
  { t:'모리랑 수영 한 바퀴 체험판이에요', b:'코스를 걸으며 스탬프를 모으고, 완주하면 끝에서 기다리던 모리가 숨겨진 아이템을 건네줘요. 아래 버튼만 눌러도 1분이면 끝까지 가요.', go:'체험 시작', act:() => go('c-bungeo') },
  { t:'이번 계절 코스, 붕어빵이에요', b:'지도 끝에서 내가 꾸민 모리가 기다려요. 완주 아이템은 아직 물음표로 가려져 있어요.', go:'스탬프 한 번에 찍기', act:() => startBatch('bungeo') },
  { t:'스탬프가 한 번에 찍혔어요', b:'현장에선 스탬프존마다 휴대폰을 대지만, 체험에선 한 번에 찍었어요. 완주하면 숨겨진 아이템이 짜잔 하고 나와요.', go:'추억 카드 보기', act:() => { closeOvSilently(); NC.course = 'bungeo'; go('card'); } },
  { t:'완주하면 추억 카드가 만들어져요', b:'걸어온 코스 전체와 내가 꾸민 모리가 한 장에 담겨요.', go:'꾸미기 보기', act:() => go('mori') },
  { t:'받은 아이템으로 모리를 꾸며요', b:'옷장에서 눌러 입히고 벗겨요. 다음 코스 끝에서도 이 모습으로 기다려요.', go:'할인 보기', act:() => go('coupon') },
  { t:'걸을수록 할인이 올라가요', b:'스탬프를 찍은 곳이 1곳이면 5%, 2곳이면 8%, 3곳부터 10%예요. 망미·수영동 골목 스탬프는 한 단계 더 올려줘요.', go:'체험 끝내기', act:() => go('courses') },
];
const TOUR_FACE = ['smile', 'shy', 'happy', 'sleepy', 'shy', 'happy'];
function renderCoach() {
  const el = $('#coach'); if (!el) return;
  const on = MODE === 'participant' && tour != null;
  $('#app').classList.toggle('touring', on);
  if (!on) { el.hidden = true; el.innerHTML = ''; return; }
  const s = TOUR[tour];
  el.hidden = false;
  el.innerHTML = `<div class="cc"><img class="cc-mori" src="${MORI_FACE[TOUR_FACE[tour] || 'happy']}" alt="" aria-hidden="true"><div class="cc-top"><span class="step">${tour + 1} / ${TOUR.length}</span><button class="skip" data-act="tour-skip">건너뛰기</button></div><h2>${esc(s.t)}</h2><p>${esc(s.b)}</p><button class="btn primary block" data-act="tour-go">${esc(s.go)}</button></div>`;
}
function tourGo() {
  if (tour == null) return;
  const s = TOUR[tour];
  const last = tour === TOUR.length - 1;
  tour = last ? null : tour + 1;
  if (last) { S.tourSeen = true; save(); toast('다른 코스도 자유롭게 둘러보세요'); }
  s.act();
  renderCoach(); renderFab();
}
function endTour() { tour = null; S.tourSeen = true; save(); closeOvSilently(); renderCoach(); renderFab(); }
document.addEventListener('click', e => { const el = e.target.closest('[data-act="tour-restart"]'); if (!el) return; closeTools(); tour = 0; go('home'); renderCoach(); });

$('#ncFile').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0]; e.target.value = '';
  if (!f || !NC.course) return;
  const arr = NC.photos[NC.course] || (NC.photos[NC.course] = [null, null, null, null]);
  if (arr[NC.slot]) URL.revokeObjectURL(arr[NC.slot]);
  arr[NC.slot] = URL.createObjectURL(f);
  buildNecut();
});
if (MODE === 'participant' && !S.tourSeen) tour = 0;
route();
})();

</script>
</body>
</html>
